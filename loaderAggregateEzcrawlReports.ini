append = pack
label = json-import

[use]
plugin = basics
plugin = analytics

[unpack]
# Transformations pour des instances supprimées car buggées, puis recrées, cela permet de ne pas fausser les stats de date de création.
[replace]
path = id
value = get("publicUrl") \
  .split("/instance/") \
  .last() \
  .replace(/\/$/, "") \
  .thru(name => ({ \
    "onera-1": "onera", \
    "onera-3": "onera3" \
  })[name] ?? name)

path = value
value = self()

[aggregate]

[assign]
path = latest
value = get("value").maxBy(obj => \
  new Date( \
    obj.dateImport.split(' ')[2], \
    { \
      janvier:0, \
      février:1, \
      mars:2, \
      avril:3, \
      mai:4, \
      juin:5, \
      juillet:6, \
      août:7, \
      septembre:8, \
      octobre:9, \
      novembre:10, \
      décembre:11 \
    }[obj.dateImport.split(' ')[1].toLowerCase()], \
    obj.dateImport.split(' ')[0] \
  ) \
).omit(["uri"])

[exchange]
value = get("latest")

[swing]
test = pick(['URI', 'uri']).pickBy(_.identity).isEmpty()
[swing/identify]

[dedupe]
ignore = true

[OBJFlatten]
separator = fix('.')
reverse = true
safe = true

[assign]
path = dateMiseAJour
value = fix(new Date()) \
  .thru(d => new Intl.DateTimeFormat('fr-FR', { \
    year: 'numeric', \
    month: 'long', \
    day: 'numeric', \
  }).format(d))

[assign]
path = statut
value = get("dateMiseAJour").thru(date => date === self.dateImport ? "Ouverte" : "Supprimée")